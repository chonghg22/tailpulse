# Reverse proxy example: https://monitor.example.com -> tailpulse (127.0.0.1:8080)
# Copy to /etc/nginx/conf.d/tailpulse.conf, replace the names / addresses / certificate paths, then `nginx -t && nginx -s reload`.
#
# - Dashboard: protected by tailpulse's own password (TAILPULSE_VIEW_PASSWORD, Basic auth) + rate limit here.
#   Add an `allow`/`deny` list below if only your office/VPN should see it.
# - /ingest: only your agent servers may post. Prefer sending agents straight to the private address
#   (http://<private-ip>:8080/ingest, firewall open to agent IPs only). Use this public path only for servers
#   that cannot reach the private network, and list their public IPs. The token is still checked by tailpulse.
# - Example addresses are documentation ranges (RFC 5737). Replace them with yours.

# Slow down password guessing: 2 requests/s per IP, burst 20 (opening the dashboard needs ~5)
limit_req_zone $binary_remote_addr zone=tailpulse:10m rate=2r/s;
# Agents post up to twice a second when busy
limit_req_zone $binary_remote_addr zone=tailpulse_ingest:1m rate=10r/s;

server {
    listen 80;
    server_name monitor.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name monitor.example.com;

    ssl_certificate     /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;

    access_log /var/log/nginx/tailpulse.access.log;
    error_log  /var/log/nginx/tailpulse.error.log;
    charset UTF-8;
    server_tokens off;

    # If a load balancer sits in front of nginx, trust its X-Forwarded-For (its subnet only)
    # set_real_ip_from 192.0.2.0/24;
    # real_ip_header X-Forwarded-For;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    limit_req zone=tailpulse burst=20 nodelay;
    limit_req_status 429;

    # Optional: dashboard only from the office / VPN
    # allow 198.51.100.0/24;
    # deny all;

    location = /ingest {
        allow 203.0.113.10;   # agent server outside the private network
        allow 203.0.113.11;
        deny all;
        limit_req zone=tailpulse_ingest burst=50 nodelay;
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Live stream (Server-Sent Events): never buffer, keep the connection open
    location = /api/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

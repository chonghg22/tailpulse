name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: server (./gradlew test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon

  agent:
    name: agent (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.6", "3.13"]   # the agent must keep working on old servers
    container: python:${{ matrix.python }}-slim
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s agent/tests -v

  scripts:
    name: shell scripts and Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck agent/install-agent.sh deploy/watchdog/tailpulse-watchdog.sh dev
      - run: docker build -t tailpulse:ci .

# Demo:  docker compose up --build   →  http://localhost:8080
#
# Runs the collector with sample services (demo profile, public demo token), a one-shot job that writes
# yesterday's and today's 1-minute history, and a fake traffic generator. Stop with Ctrl+C,
# wipe the demo data with `docker compose down -v`.
#
# For real use, see deploy/docker-compose.prod.yml and "Run it for real" in README.md.
services:
  tailpulse:
    build: .
    image: tailpulse:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: demo
      TAILPULSE_INGEST_TOKEN: demo-token
      TAILPULSE_LANG: ${TAILPULSE_LANG:-en}
      TZ: ${TZ:-UTC}
    volumes:
      - demo-data:/app/data
    depends_on:
      demo-seed:
        condition: service_completed_successfully

  # Synthetic history so the "Today" tab is not empty on first start (never overwrites existing files)
  demo-seed:
    image: python:3.12-slim
    command: ["sh", "-c", "python3 /tools/demo_traffic.py --seed /data && chown -R 10001 /data"]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./tools:/tools:ro
      - demo-data:/data

  # Fake requests from four services on three servers. DEMO_DOWN=web-2 docker compose up  → one server "dies"
  demo:
    image: python:3.12-slim
    command: ["python3", "-u", "/tools/demo_traffic.py", "http://tailpulse:8080/ingest"]
    environment:
      TAILPULSE_INGEST_TOKEN: demo-token
      DEMO_DOWN: ${DEMO_DOWN:-}
    volumes:
      - ./tools:/tools:ro
    depends_on:
      - tailpulse

volumes:
  demo-data:
